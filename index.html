<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141020">
<meta name="x5-orientation" content="portrait">
<meta name="screen-orientation" content="portrait">
<title>我的橘猫夜晚竟会……</title>
<style>
/* =========================================================
   基础重置
   ========================================================= */
* {
  margin: 0;
  padding: 0;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  -webkit-tap-highlight-color: transparent;
}
html {
  width: 100%;
  height: 100%;
  background: #08060c;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #08060c;
  color: #e6dcc8;
  font-family: "Courier New", Consolas, "Microsoft YaHei", monospace;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  user-select: none;
  overscroll-behavior: none;
  touch-action: manipulation;
  text-align: center; /* 桌面端居中 #app */
}

/* =========================================================
   #app —— 关键修复：
   手机：100% 宽，铺满
   电脑：max-width 限制，居中显示（避免像素屏过大）
   ========================================================= */
#app {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 480px;
  background: #141020;
  overflow: hidden;
  text-align: left;
  margin: 0 auto;
}

/* =========================================================
   主菜单
   ========================================================= */
#menu {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: -webkit-flex;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-flex-direction: column;
  flex-direction: column;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  background: radial-gradient(circle at 50% 38%, #241a38 0%, #0d0a16 72%);
  text-align: center;
  padding: 30px 20px;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
}
#menu.hidden { display: none; }
.menuCat {
  font-size: 58px;
  line-height: 1;
  margin-bottom: 14px;
  -webkit-animation: bob 2s ease-in-out infinite;
  animation: bob 2s ease-in-out infinite;
}
@-webkit-keyframes bob {
  0%,100% { -webkit-transform: translateY(0); transform: translateY(0); }
  50% { -webkit-transform: translateY(-9px); transform: translateY(-9px); }
}
@keyframes bob {
  0%,100% { -webkit-transform: translateY(0); transform: translateY(0); }
  50% { -webkit-transform: translateY(-9px); transform: translateY(-9px); }
}
#menu h1 {
  font-size: 32px;
  line-height: 1.45;
  letter-spacing: 5px;
  color: #ffd08a;
  text-shadow: 3px 3px 0 #8a3d0a, 6px 6px 0 rgba(0,0,0,.4);
  margin-bottom: 10px;
  font-weight: bold;
}
.sub {
  color: #9a8fb0;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 22px;
}
#startBtn {
  width: 74%;
  max-width: 320px;
  padding: 15px 0;
  font-family: inherit;
  font-size: 17px;
  letter-spacing: 6px;
  color: #1a1020;
  background: #f2a03c;
  border: none;
  border-bottom: 5px solid #a85c10;
  border-right: 5px solid #a85c10;
  cursor: pointer;
  min-height: 52px;
  touch-action: manipulation;
  margin-bottom: 14px;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
}
#startBtn:active {
  -webkit-transform: translate(3px,3px);
  transform: translate(3px,3px);
  border-bottom-width: 2px;
  border-right-width: 2px;
  background: #ffbe5e;
}
#saveBtn {
  width: 74%;
  max-width: 320px;
  padding: 13px 0;
  font-family: inherit;
  font-size: 15px;
  letter-spacing: 6px;
  color: #e6dcc8;
  background: #2f2450;
  border: 2px solid #4b3d6e;
  border-bottom-width: 5px;
  cursor: pointer;
  min-height: 50px;
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
}
#saveBtn:active {
  -webkit-transform: translate(3px,3px);
  transform: translate(3px,3px);
  border-bottom-width: 2px;
  background: #3d2f66;
}

/* =========================================================
   游戏区
   ========================================================= */
#game {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  display: none;
  -webkit-box-orient: vertical;
  -webkit-flex-direction: column;
  flex-direction: column;
  overflow: hidden;
  background: #141020;
}
#game.active {
  display: -webkit-flex;
  display: flex;
}

/* 像素屏幕容器 */
#pixelWrap {
  width: 100%;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  background: #000;
  line-height: 0;
  font-size: 0;
  overflow: hidden;
  padding-top: constant(safe-area-inset-top);
  padding-top: env(safe-area-inset-top);
  text-align: center;
}
/* 关键修复：手机端全宽（占满屏幕宽度），电脑端由 #app 的 max-width 限制 */
#pixel {
  display: block;
  margin: 0 auto;
  width: 100%;
  height: auto;
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
  -ms-interpolation-mode: nearest-neighbor;
}

/* 信息条 */
#infoBar {
  display: -webkit-flex;
  display: flex;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  padding: 7px 10px;
  background: #241c36;
  font-size: 12px;
  color: #cbbfe0;
  border-bottom: 2px solid #352a50;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  white-space: nowrap;
  overflow: hidden;
}
#infoBar > span {
  margin-right: 8px;
  white-space: nowrap;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
#infoBar > span:first-child {
  -webkit-flex-shrink: 1;
  flex-shrink: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}
#infoBar b { color: #ffd08a; }
#speedBtn {
  margin-left: auto;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  font-family: inherit;
  font-size: 12px;
  background: #342a4c;
  color: #cbbfe0;
  border: 2px solid #4b3d6e;
  padding: 4px 9px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
  line-height: 1.4;
}
#speedBtn:active { background: #453a63; }
#settingsBtn {
  margin-left: 6px;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  font-family: inherit;
  font-size: 12px;
  background: #342a4c;
  color: #cbbfe0;
  border: 2px solid #4b3d6e;
  padding: 4px 9px;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
  line-height: 1.4;
}
#settingsBtn:active { background: #453a63; }

/* 状态面板 */
.stats {
  display: -webkit-flex;
  display: flex;
  -webkit-flex-wrap: wrap;
  flex-wrap: wrap;
  padding: 5px 6px;
  background: #1a1428;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
  border-bottom: 2px solid #2b2340;
}
.stats.hidden { display: none; }
.stat {
  -webkit-flex: 0 0 50%;
  flex: 0 0 50%;
  max-width: 50%;
  display: -webkit-flex;
  display: flex;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  padding: 3px 6px;
  font-size: 12px;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
}
.stat.wide {
  -webkit-flex: 0 0 100%;
  flex: 0 0 100%;
  max-width: 100%;
}
.lbl {
  width: 32px;
  color: #9a8fb0;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
.bar {
  -webkit-flex: 1 1 0;
  flex: 1 1 0;
  min-width: 0;
  height: 12px;
  background: #0b0812;
  border: 2px solid #3a2f55;
  position: relative;
  overflow: hidden;
  margin: 0 4px;
}
.fill {
  display: block;
  height: 100%;
  width: 0%;
  -webkit-transition: width .15s linear;
  transition: width .15s linear;
}
.fill.hp { background: #e85555; }
.fill.hunger { background: #e69b2e; }
.fill.poop { background: #a67848; }
.fill.mood { background: #d9549c; }
.fill.alert { background: #7a6ae0; }
.num {
  width: 22px;
  text-align: right;
  color: #cbbfe0;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}

/* 日志区 */
#logBox {
  -webkit-flex: 1 1 0;
  flex: 1 1 0;
  min-height: 0;
  width: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 12px;
  font-size: 14px;
  line-height: 1.7;
  background: #0f0b1a;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  -webkit-user-select: text;
  user-select: text;
  word-break: break-word;
}
#logBox::-webkit-scrollbar { width: 6px; }
#logBox::-webkit-scrollbar-thumb { background: #3a2f55; }
#logBox::-webkit-scrollbar-track { background: #0f0b1a; }
.logLine {
  margin-bottom: 3px;
  color: #c8bcd8;
  word-break: break-word;
  -webkit-animation: fadeIn .25s;
  animation: fadeIn .25s;
}
.logLine.sys { color: #ffd08a; }
.logLine.warn { color: #ff8a6a; }
.logLine.good { color: #8adf9a; }
.logLine.night { color: #9aa4ff; }
.logLine.dim { color: #8a7fa8; }
@-webkit-keyframes fadeIn {
  from { opacity: 0; -webkit-transform: translateX(-8px); transform: translateX(-8px); }
  to { opacity: 1; -webkit-transform: none; transform: none; }
}
@keyframes fadeIn {
  from { opacity: 0; -webkit-transform: translateX(-8px); transform: translateX(-8px); }
  to { opacity: 1; -webkit-transform: none; transform: none; }
}

/* 操作栏 */
#actionBar {
  display: -webkit-flex;
  display: flex;
  padding: 8px 6px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  background: #1a1428;
  border-top: 2px solid #2b2340;
  -webkit-flex-shrink: 0;
  flex-shrink: 0;
}
#actionBar button {
  -webkit-flex: 1 1 0;
  flex: 1 1 0;
  min-width: 0;
  margin: 0 3px;
  padding: 10px 2px;
  font-family: inherit;
  font-size: 14px;
  color: #e6dcc8;
  background: #2f2450;
  border: 2px solid #4b3d6e;
  border-bottom-width: 4px;
  cursor: pointer;
  display: -webkit-flex;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-flex-direction: column;
  flex-direction: column;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  min-height: 54px;
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
}
#actionBar button:first-child { margin-left: 0; }
#actionBar button:last-child { margin-right: 0; }
#actionBar button small {
  display: block;
  font-size: 10px;
  color: #9a8fb0;
  letter-spacing: 1px;
  margin-top: 2px;
}
#actionBar button:disabled {
  opacity: .28;
  cursor: not-allowed;
}
#actionBar button:active:not(:disabled) {
  -webkit-transform: translateY(2px);
  transform: translateY(2px);
  border-bottom-width: 2px;
  background: #3d2f66;
}

/* =========================================================
   弹窗 / 存档 / 结局
   ========================================================= */
#modal, #savePanel, #ending {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: -webkit-flex;
  display: flex;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  padding: 16px;
}
#modal { z-index: 30; background: rgba(6,4,12,.94); }
#savePanel { z-index: 35; background: rgba(6,4,12,.94); }
#ending {
  z-index: 40;
  background: rgba(4,2,8,.97);
  -webkit-box-orient: vertical;
  -webkit-flex-direction: column;
  flex-direction: column;
  text-align: center;
  padding: 24px 20px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#modal.hidden, #savePanel.hidden, #ending.hidden { display: none; }

#modalBox {
  width: 100%;
  max-width: 580px;
  max-height: 100%;
  background: #1c1630;
  border: 3px solid #4b3d6e;
  padding: 18px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  text-align: left;
}
#modalTitle {
  font-size: 13px;
  color: #ffd08a;
  letter-spacing: 4px;
  margin-bottom: 12px;
}
#modalDesc {
  font-size: 15px;
  line-height: 1.72;
  color: #e6dcc8;
  margin-bottom: 16px;
  white-space: pre-line;
  word-break: break-word;
}
.modalOpt {
  display: block;
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  text-align: left;
  padding: 13px 15px;
  color: #d8cce8;
  background: #2a2145;
  border: 2px solid #4b3d6e;
  cursor: pointer;
  min-height: 50px;
  touch-action: manipulation;
  margin-bottom: 10px;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
  line-height: 1.4;
}
.modalOpt:last-child { margin-bottom: 0; }
.modalOpt:active {
  background: #3d2f66;
  color: #fff;
  border-color: #7a6ae0;
}

#saveBox {
  width: 100%;
  max-width: 480px;
  max-height: 100%;
  background: #1c1630;
  border: 3px solid #4b3d6e;
  padding: 18px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  text-align: left;
}
#saveBoxTitle {
  font-size: 13px;
  color: #ffd08a;
  letter-spacing: 6px;
  margin-bottom: 14px;
  text-align: center;
}
#saveInfo {
  font-size: 13px;
  line-height: 1.85;
  color: #c8bcd8;
  margin-bottom: 16px;
  min-height: 60px;
}
#saveInfo p { margin: 0; word-break: break-word; }
#saveInfo .saveTime {
  color: #8a7fa8;
  font-size: 11px;
  margin-top: 8px;
}
#saveInfo .saveEmpty {
  color: #8a7fa8;
  text-align: center;
  padding: 22px 0;
  letter-spacing: 2px;
}
#saveBtns button {
  display: block;
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  padding: 13px 15px;
  color: #d8cce8;
  background: #2a2145;
  border: 2px solid #4b3d6e;
  cursor: pointer;
  min-height: 50px;
  touch-action: manipulation;
  margin-bottom: 9px;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
}
#saveBtns button:last-child { margin-bottom: 0; }
#saveBtns button:active {
  background: #3d2f66;
  color: #fff;
  border-color: #7a6ae0;
}

#endTitle {
  font-size: 32px;
  color: #ff7a6a;
  letter-spacing: 8px;
  text-shadow: 3px 3px 0 #3a0a0a;
  margin-bottom: 18px;
  font-weight: bold;
}
#endText {
  max-width: 580px;
  font-size: 14px;
  line-height: 1.9;
  color: #b8aac8;
  white-space: pre-line;
  margin-bottom: 22px;
  word-break: break-word;
}
#restartBtn {
  padding: 14px 36px;
  font-family: inherit;
  font-size: 16px;
  letter-spacing: 5px;
  background: #f2a03c;
  color: #1a1020;
  border: none;
  border-bottom: 5px solid #a85c10;
  cursor: pointer;
  min-height: 52px;
  touch-action: manipulation;
  -webkit-appearance: none;
  appearance: none;
  border-radius: 0;
}
#restartBtn:active {
  background: #ffbe5e;
  -webkit-transform: translateY(2px);
  transform: translateY(2px);
  border-bottom-width: 3px;
}

/* =========================================================
   【关键修复】桌面端限制整体宽度，避免像素屏过大
   ========================================================= */
@media (min-width: 700px) {
  body {
    background: #05040a;
  }
  #app {
    max-width: 480px;      /* 电脑端整体限制在 480px */
    height: 100% !important;
    border-left: 3px solid #2b2340;
    border-right: 3px solid #2b2340;
  }
}

/* =========================================================
   小屏 / 横屏媒体查询
   ========================================================= */
@media (max-width: 480px) {
  .menuCat { font-size: 48px; }
  #menu h1 { font-size: 26px; letter-spacing: 3px; }
  #endTitle { font-size: 26px; letter-spacing: 6px; }
}
@media (max-width: 360px) {
  .menuCat { font-size: 40px; }
  #menu h1 { font-size: 22px; letter-spacing: 2px; }
  #endTitle { font-size: 22px; letter-spacing: 4px; }
  #infoBar { font-size: 10px; }
  #infoBar > span:first-child { display: none; }
  #logBox { font-size: 12px; padding: 8px 10px; }
  #actionBar button { font-size: 12px; min-height: 50px; }
  #actionBar button small { font-size: 9px; }
  .stat { font-size: 10px; padding: 2px 4px; }
  .lbl { width: 26px; }
  .num { width: 18px; }
  .bar { height: 10px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  #pixel {
    width: auto;
    max-width: 100%;
    max-height: 130px;
  }
  #pixelWrap { padding-top: 0; }
  .menuCat { font-size: 36px; margin-bottom: 8px; }
  #menu h1 { font-size: 20px; letter-spacing: 2px; margin-bottom: 6px; }
  #menu .sub { display: none; }
  #startBtn, #saveBtn { padding: 10px 0; font-size: 15px; letter-spacing: 3px; min-height: 44px; margin-bottom: 8px; }
  #logBox { font-size: 12px; line-height: 1.6; }
  #actionBar button { min-height: 46px; font-size: 12px; padding: 8px 2px; }
  #actionBar button small { display: none; }
  .stats { padding: 4px 6px; }
  .stat { font-size: 10px; padding: 2px 4px; }
  #endTitle { font-size: 22px; }
  #endText { font-size: 12px; }
}
</style>
</head>
<body>
<div id="app">

  <div id="menu">
    <div class="menuCat">🐱</div>
    <h1>我的橘猫<br>夜晚竟会……</h1>
    <p class="sub">一个关于王慕婷和张昊嵩的故事</p>
    <button id="startBtn" type="button">开 始 游 戏</button>
    <button id="saveBtn" type="button">存 档</button>
  </div>

  <div id="game">
    <!-- 画布尺寸从 320x100 改为 320x140，纵向占比更大 -->
    <div id="pixelWrap"><canvas id="pixel" width="320" height="140"></canvas></div>

    <div id="infoBar">
      <span>第 <b id="dayNum">1</b> 天</span>
      <span id="phaseEl">白天 ☀️</span>
      <span id="clockEl">0:00 / 4:00</span>
      <button id="speedBtn" type="button">⏩ 1x</button>
      <button id="settingsBtn" type="button">⚙ 设置</button>
    </div>

    <div id="dayStats" class="stats">
      <div class="stat"><span class="lbl">生命</span><div class="bar"><i id="fHp" class="fill hp"></i></div><span class="num" id="nHp">10</span></div>
      <div class="stat"><span class="lbl">饥饿</span><div class="bar"><i id="fHunger" class="fill hunger"></i></div><span class="num" id="nHunger">10</span></div>
      <div class="stat"><span class="lbl">便意</span><div class="bar"><i id="fPoop" class="fill poop"></i></div><span class="num" id="nPoop">0</span></div>
      <div class="stat"><span class="lbl">心情</span><div class="bar"><i id="fMood" class="fill mood"></i></div><span class="num" id="nMood">5</span></div>
    </div>

    <div id="nightStats" class="stats hidden">
      <div class="stat wide"><span class="lbl">警惕值</span><div class="bar"><i id="fAlert" class="fill alert"></i></div><span class="num" id="nAlert">0</span></div>
    </div>

    <div id="logBox"></div>

    <div id="actionBar">
      <button id="btnHeal" type="button">包扎<small>1/1</small></button>
      <button id="btnFeed" type="button">喂食<small>2/2</small></button>
      <button id="btnToilet" type="button">如厕<small>1/1</small></button>
      <button id="btnPet" type="button">撸猫<small>不限</small></button>
    </div>
  </div>

  <div id="modal" class="hidden">
    <div id="modalBox">
      <div id="modalTitle"></div>
      <div id="modalDesc"></div>
      <div id="modalOpts"></div>

function drawCat(x, groundY, t){
  var bob = Math.sin(t*9)*1.2;
  x = Math.round(x);
  var y = Math.round(groundY + bob);

  var C  = '#f2a03c';
  var CD = '#d97d1e';
  var CW = '#fff2dd';

  px(x+1, groundY+1, 13, 2, 'rgba(60,40,20,.25)');

  var tw = Math.sin(t*6)*2;
  px(x-4, y-7+tw, 4, 2, CD);
  px(x-6, y-9+tw, 3, 2, CD);

  px(x, y-7, 11, 7, C);
  px(x+1, y-6, 3, 1, CD);
  px(x+6, y-5, 3, 1, CD);

  px(x+1, y-2, 3, 2, C);
  px(x+7, y-2, 3, 2, C);

  px(x+8, y-11, 8, 8, C);
  px(x+8,  y-13, 3, 3, C);
  px(x+13, y-13, 3, 3, C);
  px(x+9,  y-12, 1, 1, CD);
  px(x+14, y-12, 1, 1, CD);

  px(x+9,  y-9, 2, 2, '#3a2410');
  px(x+13, y-9, 2, 2, '#3a2410');
  px(x+11, y-6, 2, 1, '#e08080');
  px(x+12, y-3, 3, 2, CW);
}

function updateHUD(){
  $('dayNum').textContent = G.day;
  $('phaseEl').textContent = G.phase === 'day' ? '白天 ☀️' : (G.phase === 'night' ? '夜晚 🌙' : '—');
  var total = G.phase === 'day' ? DAY_LEN : NIGHT_LEN;
  if(G.phase === 'day' || G.phase === 'night'){
    $('clockEl').textContent = fmt(G.t) + ' / ' + fmt(total);
  } else {
    $('clockEl').textContent = '—';
  }

  if(G.phase === 'day'){
    $('dayStats').classList.remove('hidden');
    $('nightStats').classList.add('hidden');
    setBar('fHp','nHp', G.hp, 10);
    setBar('fHunger','nHunger', G.hunger, 10);
    setBar('fPoop','nPoop', G.poop, 10);
    setBar('fMood','nMood', G.mood, 10);
  } else {
    $('dayStats').classList.add('hidden');
    $('nightStats').classList.remove('hidden');
    setBar('fAlert','nAlert', G.alert, 10);
  }
}

/* =========================================================
   弹窗
   ========================================================= */
function showModal(title, desc, options, onChoose){
  paused = true;
  modalTitle.textContent = title;
  modalDesc.textContent = desc;
  modalOpts.innerHTML = '';
  options.forEach(function(opt, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'modalOpt';
    b.textContent = opt;
    b.onclick = function(){
      modalEl.classList.add('hidden');
      paused = false;
      onChoose(i);
    };
    modalOpts.appendChild(b);
  });
  modalEl.classList.remove('hidden');
}

/* =========================================================
   存档 / 读档
   ========================================================= */
function saveGame(){
  if(G.phase !== 'day' && G.phase !== 'night') return false;
  var data = {
    day: G.day,
    phase: G.phase,
    t: G.t,
    hp: G.hp, hunger: G.hunger, poop: G.poop, mood: G.mood,
    healUsed: G.healUsed, feedUsed: G.feedUsed, toiletUsed: G.toiletUsed,
    bites: G.bites, moodTimer: G.moodTimer,
    hungerMark: G.hungerMark, poopMark: G.poopMark,
    eventTimes: G.eventTimes.slice(),
    alert: G.alert,
    nightQueue: G.nightQueue.slice(),
    nightEventTimes: G.nightEventTimes.slice(),
    savedAt: Date.now()
  };
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  }catch(e){
    return false;
  }
}

function readSave(){
  try{
    var raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    var d = JSON.parse(raw);
    if(!d || typeof d !== 'object') return null;
    return d;
  }catch(e){ return null; }
}

function clearSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

function continueGame(){
  var d = readSave();
  if(!d) return;
  savePanel.classList.add('hidden');

  G.phase = (d.phase === 'night') ? 'night' : 'day';
  G.day   = d.day || 1;
  G.t     = typeof d.t === 'number' ? d.t : 0;
  G.hp    = typeof d.hp === 'number' ? d.hp : 10;
  G.hunger= typeof d.hunger === 'number' ? d.hunger : 10;
  G.poop  = typeof d.poop === 'number' ? d.poop : 0;
  G.mood  = typeof d.mood === 'number' ? d.mood : 5;
  G.healUsed   = !!d.healUsed;
  G.feedUsed   = d.feedUsed || 0;
  G.toiletUsed = !!d.toiletUsed;
  G.bites      = d.bites || 0;
  G.moodTimer  = d.moodTimer || 12;
  G.alert      = d.alert || 0;

  G.eventTimes     = Array.isArray(d.eventTimes) ? d.eventTimes.slice() : [];
  G.nightQueue     = Array.isArray(d.nightQueue) ? d.nightQueue.slice() : [];
  G.nightEventTimes= Array.isArray(d.nightEventTimes) ? d.nightEventTimes.slice() : [];

  G.hungerMark = (typeof d.hungerMark === 'number') ? d.hungerMark : Math.floor(G.hunger + 1e-9);
  G.poopMark   = (typeof d.poopMark === 'number') ? d.poopMark : Math.floor(G.poop + 1e-9);

  G.cat = {x:160, tx:200, idle:0, dir:1, anim:0};
  G.speed = 1;
  $('speedBtn').textContent = '⏩ 1x';

  paused = false;
  modalEl.classList.add('hidden');
  endingEl.classList.add('hidden');
  menuEl.classList.add('hidden');
  gameEl.classList.add('active');
  logBox.innerHTML = '';
  lastTs = 0;
  setAppHeight();

  log('━━━━━━━━━━━━━━━━━━━━', 'sys');
  log('📁 读取存档成功。', 'sys');

  if(G.phase === 'day'){
    G.t = clamp(G.t, 0, DAY_LEN - 1);
    log('☀️ 第 ' + G.day + ' 天 · 白天继续。', 'sys');
    if(G.eventTimes.length === 0 && G.t < DAY_LEN - 20){
      var remain = DAY_LEN - G.t;
      var n = randInt(1, 3);
      var times = [];
      for(var i=0;i<n;i++) times.push(G.t + remain*(i+1)/(n+1));
      G.eventTimes = times;
    }
  } else {
    G.t = clamp(G.t, 0, NIGHT_LEN - 1);
    log('🌙 夜晚继续。', 'sys');

    if(G.nightQueue.length > 0){
      var remain2 = NIGHT_LEN - G.t;
      if(remain2 < 4){
        G.nightQueue = [];
        G.nightEventTimes = [];
        G.phase = 'day';
        G.day++;
        G.t = 0;
        log('   （剩余夜晚时间不足，直接天亮了。）', 'sys');
        setTimeout(startDay, 200);
      } else {
        var nn = G.nightQueue.length;
        G.nightEventTimes = [];
        for(var k=0;k<nn;k++){
          var tk = G.t + remain2*(k+1)/(nn+1);
          G.nightEventTimes.push(clamp(tk, G.t + 1, NIGHT_LEN - 1));
        }
        G.nightEventTimes.sort(function(a,b){return a-b;});
      }
    } else {
      G.nightEventTimes = [];
    }
  }

  updateActions();
  updateHUD();
}

function openSavePanel(){
  var d = readSave();
  var info = $('saveInfo');
  var btns = $('saveBtns');
  info.innerHTML = '';
  btns.innerHTML = '';

  function addBtn(label, fn){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.onclick = fn;
    btns.appendChild(b);
  }

  if(!d){
    info.innerHTML = '<p class="saveEmpty">暂 无 存 档</p>';
  } else {
    var phaseTxt = d.phase === 'night' ? '夜晚 🌙' : '白天 ☀️';
    info.innerHTML =
      '<p>第 ' + (d.day||1) + ' 天 · ' + phaseTxt + '</p>' +
      '<p>生命 ' + r1(d.hp||0) + ' · 饥饿 ' + r1(d.hunger||0) +
        ' · 便意 ' + r1(d.poop||0) + ' · 心情 ' + r1(d.mood||0) + '</p>' +
      '<p>警惕值 ' + (d.alert||0) + ' / 10</p>' +
      '<p class="saveTime">保存于 ' + new Date(d.savedAt || Date.now()).toLocaleString() + '</p>';
    addBtn('读取存档', continueGame);
    addBtn('删除存档', function(){ clearSave(); openSavePanel(); });
  }
  addBtn('关闭', function(){ savePanel.classList.add('hidden'); });
  savePanel.classList.remove('hidden');
}

/* =========================================================
   白天
   ========================================================= */
function startDay(){
  G.phase = 'day';
  G.t = 0;
  G.healUsed = false;
  G.feedUsed = 0;
  G.toiletUsed = false;
  G.moodTimer = 12;
  G.cat.x = 160;
  G.cat.tx = rand(20, 300);
  G.cat.idle = 0;

  G.hungerMark = Math.floor(G.hunger + 1e-9);
  G.poopMark   = Math.floor(G.poop + 1e-9);

  var moodFactor = (10 - G.mood) / 10 * 4;
  var count = Math.round(1 + moodFactor + rand(-0.6, 0.6));
  count = clamp(count, 1, 5);

  var seg = DAY_LEN / (count + 1);
  var times = [];
  for(var i=0;i<count;i++){
    times.push(clamp(seg*(i+1) + rand(-seg*0.28, seg*0.28), 6, DAY_LEN-6));
  }
  times.sort(function(a,b){return a-b;});
  G.eventTimes = times;

  log('━━━━━━━━━━━━━━━━━━━━', 'sys');
  log('☀️ 第 ' + G.day + ' 天 · 白天开始了。', 'sys');
  log('张昊嵩在屋里溜达，心情：' + G.mood + '/10。它今天大概会闯 ' + count + ' 次祸。');

  updateActions();
  updateHUD();
}

function updateDay(dt){
  if(paused) return;

  G.t += dt;
  G.cat.anim += dt;

  G.hunger = Math.max(0, G.hunger - (2/60)*dt);
  G.poop = Math.min(10, G.poop + (1/60)*dt);

  var hInt = Math.floor(G.hunger + 1e-9);
  if(hInt !== G.hungerMark){
    var delta = hInt - G.hungerMark;
    if(delta < 0){
      log('🍽️ 张昊嵩饿了，饥饿值 ' + delta + '（' + r1(G.hunger) + '/10）');
    }else{
      log('🍽️ 张昊嵩的饥饿值 +' + delta + '（' + r1(G.hunger) + '/10）','good');
    }
    G.hungerMark = hInt;
  }

  var pInt = Math.floor(G.poop + 1e-9);
  if(pInt !== G.poopMark){
    var delta2 = pInt - G.poopMark;
    if(delta2 > 0){
      log('💩 张昊嵩想上厕所了，便意值 +' + delta2 + '（' + r1(G.poop) + '/10）');
    }else{
      log('💩 张昊嵩的便意值 ' + delta2 + '（' + r1(G.poop) + '/10）','good');
    }
    G.poopMark = pInt;
  }

  G.moodTimer -= dt;
  if(G.moodTimer <= 0){
    G.moodTimer = rand(12, 26);
    var up = Math.random() < 0.5;
    if(up && G.mood < 10){
      G.mood = clamp(G.mood + 1, 0, 10);
      log('😺 ' + pick(MOOD_UP) + ' 心情值 +1（' + G.mood + '/10）','good');
    } else if(!up && G.mood > 0){
      G.mood = clamp(G.mood - 1, 0, 10);
      log('😾 ' + pick(MOOD_DOWN) + ' 心情值 -1（' + G.mood + '/10）','warn');
    }
  }

  updateCatMove(dt);

  while(G.eventTimes.length && G.t >= G.eventTimes[0]){
    G.eventTimes.shift();
    triggerCatEvent();
    if(paused || G.phase !== 'day') return;
  }

  if(G.hp <= 0){ endGame('dead'); return; }
  if(G.hunger <= 0){ endGame('starve'); return; }
  if(G.poop >= 10){ endGame('poop'); return; }

  if(G.t >= DAY_LEN){ startNight(); }
}

function updateCatMove(dt){
  var c = G.cat;
  var dx = c.tx - c.x;
  if(Math.abs(dx) < 1.5){
    c.idle -= dt;
    if(c.idle <= 0){
      c.tx = rand(12, 300);
      c.idle = rand(0.8, 2.6);
    }
  } else {
    var speed = 26;
    c.x += (dx > 0 ? 1 : -1) * speed * dt;
    c.dir = dx > 0 ? 1 : -1;
  }
}

function triggerCatEvent(){
  var txt = pick(CAT_EVENTS);
  G.hp = Math.max(0, G.hp - 1);
  log('⚠️ ' + txt, 'warn');
  log('   张昊嵩受了点伤，生命值 -1（' + G.hp + '/10）','warn');
  updateHUD();
  if(G.hp <= 0){ endGame('dead'); }
}

/* =========================================================
   操作
   ========================================================= */
function doHeal(){
  if(G.phase !== 'day' || G.healUsed) return;
  G.healUsed = true;
  var before = G.hp;
  G.hp = Math.min(10, G.hp + 3);
  log('🩹 你给张昊嵩包扎了伤口，生命值 +' + r1(G.hp - before) + '（' + r1(G.hp) + '/10）。','good');
  updateActions(); updateHUD();
}

function doFeed(){
  if(G.phase !== 'day' || G.feedUsed >= 2) return;
  G.feedUsed++;
  var before = G.hunger;
  G.hunger = Math.min(10, G.hunger + 3);
  G.hungerMark = Math.floor(G.hunger + 1e-9);
  log('🍚 你倒了一碗猫粮，张昊嵩埋头猛吃，饥饿值 +' + r1(G.hunger - before) + '（' + r1(G.hunger) + '/10）。','good');
  updateActions(); updateHUD();
}

function doToilet(){
  if(G.phase !== 'day' || G.toiletUsed) return;
  G.toiletUsed = true;
  var before = G.poop;
  G.poop = Math.max(0, G.poop - 3);
  G.poopMark = Math.floor(G.poop + 1e-9);
  log('🚽 你清理了猫砂盆，张昊嵩舒服地解决了，便意值 ' + r1(G.poop - before) + '（' + r1(G.poop) + '/10）。','good');
  updateActions(); updateHUD();
}

function doPet(){
  if(G.phase !== 'day') return;
  var biteChance = G.mood >= 6 ? 0 : (6 - G.mood) * 0.08;

  if(Math.random() < biteChance){
    G.bites++;
    log('🩸 张昊嵩心情不好，回头就咬了你一口！（被咬 ' + G.bites + '/5）','warn');
    if(G.bites >= 5){
      G.bites = 0;
      setTimeout(askAboutBite, 260);
    }
  } else {
    log('🐱 张昊嵩发出咕噜咕噜的声音，脑袋往你手心里蹭了蹭。','good');
  }
}

function askAboutBite(){
  showModal(
    '【忍无可忍】',
    '张昊嵩已经咬了你五口了。\n手背上的牙印火辣辣地疼，它却舔着爪子，一脸无辜。\n你要怎么做？',
    ['训斥它', '抛弃它'],
    function(idx){
      if(idx === 0){
        log('🗣️ 你板起脸训斥了张昊嵩。');
        var s = pick(TALK_BACK);
        log('🐱 张昊嵩回嘴了：' + s, 'warn');
        log('   你盯着它看了三秒，最后没忍住笑了出来。');
      } else {
        log('🚪 你打开门，把张昊嵩抱了出去。');
        log('   它在门口愣了很久，尾巴慢慢垂了下去。','warn');
        endGame('stray');
      }
    }
  );
}

/* =========================================================
   夜晚
   ========================================================= */
function startNight(){
  G.phase = 'night';
  G.t = 0;
  G.alert = 0;

  var basics = shuffle(BASIC.map(function(_,i){return i;})).slice(0,4);
  var advIdx = randInt(0, ADV.length-1);
  var list = basics.map(function(i){ return {type:'basic', i:i}; });
  list.push({type:'adv', i:advIdx});
  if(Math.random() < 0.25){
    var k = randInt(0,3);
    list[k] = {type:'danger', i: randInt(0, DANGER.length-1)};
  }
  G.nightQueue = shuffle(list);

  var rawTimes = [];
  for(var i=0;i<5;i++){
    rawTimes.push(22 + i*34 + rand(-6,6));
  }
  G.nightEventTimes = rawTimes
    .map(function(t){ return clamp(t, 10, NIGHT_LEN - 10); })
    .sort(function(a,b){return a-b;});

  updateActions();
  updateHUD();

  log('━━━━━━━━━━━━━━━━━━━━', 'sys');
  log('🌙 夜深了，王慕婷洗漱完，钻进被窝睡着了。', 'night');
  log('   客厅里，橘猫的身影慢慢拉长……', 'night');
  log('   张昊嵩变成了人形，轻手轻脚地走进了卧室。', 'night');
  log('   ——今晚，你操控的是张昊嵩。', 'night');
}

function updateNight(dt){
  if(paused) return;
  G.t += dt;

  while(G.nightEventTimes.length && G.t >= G.nightEventTimes[0]){
    G.nightEventTimes.shift();
    showNightEvent();
    return;
  }

  if(G.t >= NIGHT_LEN && G.nightQueue.length > 0){
    G.nightEventTimes = [];
    showNightEvent();
    return;
  }

  if(G.t >= NIGHT_LEN && G.nightQueue.length === 0 && G.nightEventTimes.length === 0){
    G.phase = 'day';
    G.day++;
    G.t = 0;
    log('🌅 天亮了。张昊嵩伸了个懒腰，又变回了那只圆滚滚的橘猫。', 'sys');
    setTimeout(startDay, 300);
  }
}

function showNightEvent(){
  var ev = G.nightQueue.shift();
  if(!ev) return;

  var data = null;
  if(ev.type === 'basic') data = BASIC[ev.i];
  else if(ev.type === 'adv') data = ADV[ev.i];
  else if(ev.type === 'danger') data = DANGER[ev.i];

  if(!data || !Array.isArray(data) || data.length < 4){
    log('⚠️ 夜晚事件数据异常，已跳过。','warn');
    if(G.nightQueue.length === 0 && G.nightEventTimes.length === 0 && G.t >= NIGHT_LEN){
      G.phase = 'day';
      G.day++;
      G.t = 0;
      setTimeout(startDay, 300);
    }
    return;
  }

  var pool = [1,1,1,2,2,3];
  var incs = [pick(pool), pick(pool), pick(pool)];
  var opts = [data[1], data[2], data[3]];
  var order = shuffle([0,1,2]);

  var titleMap = { basic:'【夜色 · 静谧】', adv:'【夜色 · 心跳】', danger:'【夜色 · 危险】' };

  paused = true;
  modalTitle.textContent = titleMap[ev.type] || '【夜色】';
  modalDesc.textContent = data[0];
  modalOpts.innerHTML = '';

  order.forEach(function(i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'modalOpt';
    b.textContent = opts[i];
    b.onclick = function(){
      modalEl.classList.add('hidden');
      paused = false;

      var inc = incs[i];
      G.alert = Math.min(10, G.alert + inc);
      log('· ' + data[0], 'night');
      log('  → 你选择了「' + opts[i] + '」，警惕值 +' + inc + '（' + G.alert + '/10）');
      updateHUD();

      if(G.alert >= 10){
        endGame('alert');
      }
    };
    modalOpts.appendChild(b);
  });
  modalEl.classList.remove('hidden');
}

/* =========================================================
   结局
   ========================================================= */
function endGame(key){
  G.phase = 'end';
  paused = true;
  clearSave();
  var e = ENDINGS[key];
  endingEl.querySelector('#endTitle').textContent = e.title;
  endingEl.querySelector('#endText').textContent = e.text;
  endingEl.classList.remove('hidden');
  log('💀 游戏结束 —— ' + e.title.replace(/ /g,''), 'warn');
}

/* =========================================================
   界面切换
   ========================================================= */
function exitToMenu(){
  G.phase = 'menu';
  paused = false;
  modalEl.classList.add('hidden');
  endingEl.classList.add('hidden');
  savePanel.classList.add('hidden');
  gameEl.classList.remove('active');
  menuEl.classList.remove('hidden');
  setAppHeight();
}

/* =========================================================
   主循环
   ========================================================= */
var lastTs = 0;
var hudTick = 0;

function loop(ts){
  requestAnimationFrame(loop);
  var dtRaw = lastTs ? Math.min(0.06, (ts - lastTs)/1000) : 0;
  lastTs = ts;
  var dt = dtRaw * G.speed;

  if(G.phase === 'day') updateDay(dt);
  else if(G.phase === 'night') updateNight(dt);

  if(G.phase === 'day' || G.phase === 'night'){
    // 关键：清屏尺寸改为 320x140
    ctx.clearRect(0,0,320,140);
    if(G.phase === 'day') drawDayScene();
    else drawNightScene();

    hudTick += dtRaw;
    if(hudTick > 0.08){
      hudTick = 0;
      updateHUD();
    }
  }
}

/* =========================================================
   启动 / 重开
   ========================================================= */
function startGame(){
  G.phase = 'day';
  G.day = 1;
  G.t = 0;
  G.speed = 1;
  $('speedBtn').textContent = '⏩ 1x';
  G.hp = 10;
  G.hunger = 10;
  G.poop = 0;
  G.mood = 5;
  G.healUsed = false;
  G.feedUsed = 0;
  G.toiletUsed = false;
  G.bites = 0;
  G.alert = 0;
  G.hungerMark = 10;
  G.poopMark = 0;
  G.moodTimer = 12;
  G.eventTimes = [];
  G.nightQueue = [];
  G.nightEventTimes = [];
  G.cat = {x:160, tx:200, idle:0, dir:1, anim:0};
  paused = false;

  logBox.innerHTML = '';
  modalEl.classList.add('hidden');
  endingEl.classList.add('hidden');
  savePanel.classList.add('hidden');
  menuEl.classList.add('hidden');
  gameEl.classList.add('active');

  lastTs = 0;
  setAppHeight();
  startDay();
}

/* =========================================================
   事件绑定
   ========================================================= */
$('startBtn').addEventListener('click', startGame, false);
$('saveBtn').addEventListener('click', openSavePanel, false);

$('restartBtn').addEventListener('click', function(){
  endingEl.classList.add('hidden');
  exitToMenu();
}, false);

$('btnHeal').addEventListener('click', doHeal, false);
$('btnFeed').addEventListener('click', doFeed, false);
$('btnToilet').addEventListener('click', doToilet, false);
$('btnPet').addEventListener('click', doPet, false);

$('speedBtn').addEventListener('click', function(){
  G.speed = G.speed === 1 ? 2 : (G.speed === 2 ? 4 : 1);
  $('speedBtn').textContent = '⏩ ' + G.speed + 'x';
}, false);

$('settingsBtn').addEventListener('click', function(){
  if(G.phase !== 'day' && G.phase !== 'night') return;
  showModal(
    '【设置】',
    '游戏已暂停。\n你可以继续游戏，或保存进度并返回主菜单。',
    ['继续游戏', '存档并退出'],
    function(idx){
      if(idx === 0) return;
      var ok = saveGame();
      if(ok) log('💾 进度已保存。','sys');
      else   log('⚠️ 存档失败（浏览器存储不可用）。','warn');
      paused = true;
      setTimeout(exitToMenu, ok ? 200 : 500);
    }
  );
}, false);

requestAnimationFrame(loop);

})();
</script>
