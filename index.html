<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141020">
<title>我的橘猫夜晚竟会……</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

html{
  width:100%;height:100%;overflow:hidden;background:#07060c;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}

body{
  width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  background:#07060c;color:#e6dcc8;
  font-family:"Courier New",Consolas,"Microsoft YaHei",monospace;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  display:flex;align-items:center;justify-content:center;
}

button{
  font-family:inherit;-webkit-tap-highlight-color:transparent;
  -webkit-appearance:none;appearance:none;outline:none;
  border-radius:0;cursor:pointer;touch-action:manipulation;
}

#app{
  position:fixed;top:0;left:0;
  width:100%;max-width:980px;
  height:100vh;height:var(--app-h, 100vh);
  left:50%;transform:translateX(-50%);
  background:#141020;
  display:flex;flex-direction:column;
  border-left:3px solid #2b2340;border-right:3px solid #2b2340;
  overflow:hidden;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}

/* ============ 主菜单 ============ */
#menu{
  position:absolute;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(circle at 50% 38%,#241a38 0%,#0d0a16 72%);
  text-align:center;
  padding: calc(env(safe-area-inset-top, 0px) + 20px)
           calc(env(safe-area-inset-right, 0px) + 20px)
           calc(env(safe-area-inset-bottom, 0px) + 20px)
           calc(env(safe-area-inset-left, 0px) + 20px);
}
#menu.hidden{display:none;}
.menuCat{font-size:62px;filter:drop-shadow(0 0 14px #f2a03c88);animation:bob 2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#menu h1{
  font-size:clamp(22px,5.4vw,42px);line-height:1.45;letter-spacing:5px;
  color:#ffd08a;text-shadow:3px 3px 0 #8a3d0a,6px 6px 0 #00000066;
}
.sub{color:#9a8fb0;font-size:12px;letter-spacing:2px;}
#startBtn{
  margin-top:12px;padding:16px 44px;font-family:inherit;font-size:18px;letter-spacing:6px;
  color:#1a1020;background:#f2a03c;border:none;
  border-bottom:5px solid #a85c10;border-right:5px solid #a85c10;
  min-height:56px;touch-action:manipulation;
}
#startBtn:active{transform:translate(3px,3px);border-bottom-width:2px;border-right-width:2px;}
#saveBtn{
  padding:14px 40px;font-family:inherit;font-size:16px;letter-spacing:6px;
  color:#e6dcc8;background:#2f2450;border:2px solid #4b3d6e;border-bottom-width:5px;
  min-height:52px;touch-action:manipulation;
}
#saveBtn:active{transform:translate(3px,3px);border-bottom-width:2px;}
@media (hover: hover) and (pointer: fine){
  #startBtn:hover{background:#ffbe5e;}
  #saveBtn:hover{background:#3d2f66;}
}
@media (hover: none){
  #startBtn:hover,#saveBtn:hover{background:inherit;}
  #startBtn:hover{background:#f2a03c;}
  #saveBtn:hover{background:#2f2450;}
}

/* ============ 游戏区 ============ */
#game{display:none;flex-direction:column;height:100%;min-height:0;}
#game.active{display:flex;}

#pixelWrap{background:#000;flex:0 0 auto;line-height:0;overflow:hidden;}
#pixel{
  width:100%;height:auto;max-height:34vh;display:block;
  image-rendering:pixelated;image-rendering:crisp-edges;
  object-fit:contain;object-position:center;
}

#infoBar{
  display:flex;align-items:center;gap:10px;padding:8px 12px;background:#241c36;
  font-size:13px;color:#cbbfe0;border-bottom:2px solid #352a50;flex:0 0 auto;
  flex-wrap:wrap;
}
#infoBar b{color:#ffd08a;}
#speedBtn{
  margin-left:auto;font-family:inherit;font-size:12px;background:#342a4c;color:#cbbfe0;
  border:2px solid #4b3d6e;padding:6px 12px;min-height:34px;
  touch-action:manipulation;
}
#settingsBtn{
  font-family:inherit;font-size:12px;background:#342a4c;color:#cbbfe0;
  border:2px solid #4b3d6e;padding:6px 12px;min-height:34px;
  touch-action:manipulation;
}
#speedBtn:active,#settingsBtn:active{background:#453a63;}
@media (hover: hover) and (pointer: fine){
  #speedBtn:hover,#settingsBtn:hover{background:#453a63;}
}

.stats{
  display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;padding:8px 12px;
  background:#1a1428;flex:0 0 auto;border-bottom:2px solid #2b2340;
}
.stats.hidden{display:none;}
.stat{display:flex;align-items:center;gap:8px;font-size:12px;min-width:0;}
.stat.wide{grid-column:1/-1;}
.lbl{width:38px;color:#9a8fb0;flex:0 0 auto;}
.bar{flex:1;height:12px;background:#0b0812;border:2px solid #3a2f55;position:relative;overflow:hidden;min-width:0;}
.fill{display:block;height:100%;width:0%;transition:width .15s linear;}
.fill.hp{background:linear-gradient(#ff7a7a,#c33);}
.fill.hunger{background:linear-gradient(#ffc46a,#d9870f);}
.fill.poop{background:linear-gradient(#c8a06a,#8a6030);}
.fill.mood{background:linear-gradient(#ff9ad0,#c94a90);}
.fill.alert{background:linear-gradient(#a09aff,#5a45c9);}
.num{width:22px;text-align:right;color:#cbbfe0;flex:0 0 auto;}

#logBox{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  padding:10px 14px;font-size:14px;line-height:1.75;
  background:#0f0b1a;min-height:0;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
  scrollbar-width:none;-ms-overflow-style:none;
}
#logBox::-webkit-scrollbar{display:none;width:0;height:0;}
.logLine{margin-bottom:3px;color:#c8bcd8;animation:fadeIn .25s;word-wrap:break-word;overflow-wrap:break-word;}
.logLine.sys{color:#ffd08a;}
.logLine.warn{color:#ff8a6a;}
.logLine.good{color:#8adf9a;}
.logLine.night{color:#9aa4ff;}
.logLine.dim{color:#8a7fa8;}
@keyframes fadeIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

#actionBar{
  display:flex;gap:6px;
  padding:8px 10px calc(env(safe-area-inset-bottom, 0px) + 10px);
  background:#1a1428;border-top:2px solid #2b2340;flex:0 0 auto;
}
#actionBar button{
  flex:1;padding:11px 2px;font-family:inherit;font-size:14px;color:#e6dcc8;
  background:#2f2450;border:2px solid #4b3d6e;border-bottom-width:4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  min-height:58px;touch-action:manipulation;
}
#actionBar button small{font-size:10px;color:#9a8fb0;letter-spacing:1px;}
#actionBar button:disabled{opacity:.28;cursor:not-allowed;}
#actionBar button:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;}
@media (hover: hover) and (pointer: fine){
  #actionBar button:hover:not(:disabled){background:#3d2f66;}
}

/* ============ 弹窗 ============ */
#modal{
  position:absolute;inset:0;z-index:30;background:rgba(6,4,12,.92);
  display:flex;align-items:center;justify-content:center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px)
           calc(env(safe-area-inset-right, 0px) + 16px)
           calc(env(safe-area-inset-bottom, 0px) + 16px)
           calc(env(safe-area-inset-left, 0px) + 16px);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
#modal.hidden{display:none;}
#modalBox{
  width:100%;max-width:580px;background:#1c1630;border:3px solid #4b3d6e;padding:20px;
  max-height:88%;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
#modalTitle{font-size:13px;color:#ffd08a;letter-spacing:4px;margin-bottom:12px;}
#modalDesc{font-size:15px;line-height:1.75;color:#e6dcc8;margin-bottom:18px;min-height:50px;white-space:pre-line;}
#modalOpts{display:flex;flex-direction:column;gap:10px;}
.modalOpt{
  font-family:inherit;font-size:14px;text-align:left;padding:14px 16px;color:#d8cce8;
  background:#2a2145;border:2px solid #4b3d6e;transition:.12s;
  min-height:50px;touch-action:manipulation;
}
.modalOpt:active{background:#3d2f66;color:#fff;border-color:#7a6ae0;transform:translateX(4px);}
@media (hover: hover) and (pointer: fine){
  .modalOpt:hover{background:#3d2f66;color:#fff;border-color:#7a6ae0;transform:translateX(4px);}
}

/* ============ 存档面板 ============ */
#savePanel{
  position:absolute;inset:0;z-index:35;background:rgba(6,4,12,.94);
  display:flex;align-items:center;justify-content:center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px)
           calc(env(safe-area-inset-right, 0px) + 16px)
           calc(env(safe-area-inset-bottom, 0px) + 16px)
           calc(env(safe-area-inset-left, 0px) + 16px);
}
#savePanel.hidden{display:none;}
#saveBox{
  width:100%;max-width:480px;background:#1c1630;border:3px solid #4b3d6e;padding:20px;
  max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
#saveBoxTitle{font-size:13px;color:#ffd08a;letter-spacing:6px;margin-bottom:16px;text-align:center;}
#saveInfo{font-size:13px;line-height:1.9;color:#c8bcd8;margin-bottom:18px;min-height:60px;}
#saveInfo p{margin:0;}
#saveInfo .saveTime{color:#8a7fa8;font-size:11px;margin-top:8px;}
#saveInfo .saveEmpty{color:#8a7fa8;text-align:center;padding:22px 0;letter-spacing:2px;}
#saveBtns{display:flex;flex-direction:column;gap:9px;}
#saveBtns button{
  font-family:inherit;font-size:14px;padding:13px 16px;color:#d8cce8;
  background:#2a2145;border:2px solid #4b3d6e;transition:.12s;
  min-height:50px;touch-action:manipulation;
}
#saveBtns button:active{background:#3d2f66;color:#fff;border-color:#7a6ae0;}
@media (hover: hover) and (pointer: fine){
  #saveBtns button:hover{background:#3d2f66;color:#fff;border-color:#7a6ae0;}
}

/* ============ 结局 ============ */
#ending{
  position:absolute;inset:0;z-index:40;background:rgba(4,2,8,.97);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;
  padding: calc(env(safe-area-inset-top, 0px) + 26px)
           calc(env(safe-area-inset-right, 0px) + 22px)
           calc(env(safe-area-inset-bottom, 0px) + 26px)
           calc(env(safe-area-inset-left, 0px) + 22px);
  text-align:center;
}
#ending.hidden{display:none;}
#endTitle{font-size:clamp(24px,6vw,46px);color:#ff7a6a;letter-spacing:8px;text-shadow:3px 3px 0 #3a0a0a;}
#endText{max-width:580px;font-size:14.5px;line-height:2;color:#b8aac8;white-space:pre-line;}
#restartBtn{
  padding:15px 38px;font-family:inherit;font-size:16px;letter-spacing:5px;
  background:#f2a03c;color:#1a1020;border:none;border-bottom:5px solid #a85c10;
  min-height:54px;touch-action:manipulation;
}
#restartBtn:active{transform:translateY(2px);border-bottom-width:3px;}
@media (hover: hover) and (pointer: fine){
  #restartBtn:hover{background:#ffbe5e;}
}
@media (hover: none){
  #restartBtn:hover{background:#f2a03c;}
}

/* ============ 小屏适配（<=380px） ============ */
@media (max-width: 380px){
  #menu h1{font-size:20px;letter-spacing:3px;}
  .menuCat{font-size:50px;}
  .sub{font-size:11px;}
  #startBtn{font-size:16px;letter-spacing:4px;padding:14px 36px;min-height:50px;}
  #saveBtn{font-size:14px;letter-spacing:4px;padding:12px 32px;min-height:46px;}

  #infoBar{font-size:11.5px;gap:8px;padding:6px 10px;}
  #speedBtn,#settingsBtn{font-size:11px;padding:5px 9px;min-height:30px;}

  .stats{gap:5px 12px;padding:7px 10px;}
  .stat{font-size:11px;gap:6px;}
  .lbl{width:32px;}
  .num{width:20px;}

  #logBox{font-size:13px;padding:8px 12px;}
  #actionBar{gap:5px;padding:7px 8px calc(env(safe-area-inset-bottom, 0px) + 8px);}
  #actionBar button{font-size:12.5px;padding:9px 1px;min-height:52px;}
  #actionBar button small{font-size:9px;}

  #modalBox{padding:16px;}
  #modalDesc{font-size:14px;}
  .modalOpt{font-size:13px;padding:12px 14px;min-height:46px;}

  #endTitle{letter-spacing:5px;}
  #endText{font-size:13px;line-height:1.9;}
  #restartBtn{font-size:14px;letter-spacing:4px;padding:13px 32px;min-height:48px;}
}

/* ============ 横屏适配 ============ */
@media (orientation: landscape) and (max-height: 520px){
  #pixel{max-height:26vh;}
  #menu{gap:10px;}
  .menuCat{font-size:40px;}
  #menu h1{font-size:20px;letter-spacing:4px;}
  .sub{font-size:11px;}
  #startBtn{padding:10px 32px;min-height:42px;font-size:15px;margin-top:6px;}
  #saveBtn{padding:9px 28px;min-height:40px;font-size:13px;}
  .stats{padding:5px 10px;gap:4px 12px;}
  #logBox{font-size:13px;line-height:1.65;padding:6px 12px;}
  #actionBar{padding:6px 8px calc(env(safe-area-inset-bottom, 0px) + 6px);}
  #actionBar button{min-height:46px;font-size:13px;padding:8px 1px;}
  #actionBar button small{font-size:9px;}
  #ending{gap:14px;}
  #endTitle{font-size:26px;}
  #endText{font-size:13px;line-height:1.8;}
}

/* ============ 触摸设备：取消 hover 残留 ============ */
@media (hover: none){
  #startBtn:hover{background:#f2a03c;}
  #saveBtn:hover{background:#2f2450;}
  #speedBtn:hover,#settingsBtn:hover{background:#342a4c;}
  #actionBar button:hover:not(:disabled){background:#2f2450;}
  .modalOpt:hover{background:#2a2145;color:#d8cce8;border-color:#4b3d6e;transform:none;}
  #saveBtns button:hover{background:#2a2145;color:#d8cce8;border-color:#4b3d6e;}
  #restartBtn:hover{background:#f2a03c;}
}
</style>
</head>
<body>
<div id="app">

  <!-- ========== 主菜单 ========== -->
  <div id="menu">
    <div class="menuCat">🐱</div>
    <h1>我的橘猫<br>夜晚竟会……</h1>
    <p class="sub">一个关于王慕婷和张昊嵩的故事</p>
    <button id="startBtn" type="button">开 始 游 戏</button>
    <button id="saveBtn" type="button">存 档</button>
  </div>

  <!-- ========== 游戏 ========== -->
  <div id="game">
    <div id="pixelWrap"><canvas id="pixel" width="320" height="100"></canvas></div>

    <div id="infoBar">
      <span>第 <b id="dayNum">1</b> 天</span>
      <span id="phaseEl">白天 ☀️</span>
      <span id="clockEl">0:00 / 4:00</span>
      <button id="speedBtn" type="button">⏩ 1x</button>
      <button id="settingsBtn" type="button">⚙ 设置</button>
    </div>

    <div id="dayStats" class="stats">
      <div class="stat"><span class="lbl">生命</span><div class="bar"><i id="fHp" class="fill hp"></i></div><span class="num" id="nHp">10</span></div>
      <div class="stat"><span class="lbl">饥饿</span><div class="bar"><i id="fHunger" class="fill hunger"></i></div><span class="num" id="nHunger">10</span></div>
      <div class="stat"><span class="lbl">便意</span><div class="bar"><i id="fPoop" class="fill poop"></i></div><span class="num" id="nPoop">0</span></div>
      <div class="stat"><span class="lbl">心情</span><div class="bar"><i id="fMood" class="fill mood"></i></div><span class="num" id="nMood">5</span></div>
    </div>

    <div id="nightStats" class="stats hidden">
      <div class="stat wide"><span class="lbl">警惕值</span><div class="bar"><i id="fAlert" class="fill alert"></i></div><span class="num" id="nAlert">0</span></div>
    </div>

    <div id="logBox"></div>

    <div id="actionBar">
      <button id="btnHeal" type="button">包扎<small>1/1</small></button>
      <button id="btnFeed" type="button">喂食<small>2/2</small></button>
      <button id="btnToilet" type="button">如厕<small>1/1</small></button>
      <button id="btnPet" type="button">撸猫<small>不限</small></button>
    </div>
  </div>

  <!-- ========== 选择弹窗 ========== -->
  <div id="modal" class="hidden">
    <div id="modalBox">
      <div id="modalTitle"></div>
      <div id="modalDesc"></div>
      <div id="modalOpts"></div>
    </div>
  </div>

  <!-- ========== 存档面板 ========== -->
  <div id="savePanel" class="hidden">
    <div id="saveBox">
      <div id="saveBoxTitle">存 档</div>
      <div id="saveInfo"></div>
      <div id="saveBtns"></div>
    </div>
  </div>

  <!-- ========== 结局 ========== -->
  <div id="ending" class="hidden">
    <div id="endTitle"></div>
    <div id="endText"></div>
    <button id="restartBtn" type="button">重 新 开 始</button>
  </div>

</div>

<script>
(function(){
'use strict';

/* =========================================================
   工具函数
   ========================================================= */
const $  = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rand  = (a,b)=>a+Math.random()*(b-a);
const randInt = (a,b)=>Math.floor(rand(a,b+1));
const pick  = a=>a[Math.floor(Math.random()*a.length)];
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt = s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
const r1 = v=>Math.round(v*10)/10;

/* ---------- 视口高度同步（处理移动端地址栏伸缩） ---------- */
function syncAppHeight(){
  let h = 0;
  if (window.visualViewport && window.visualViewport.height){
    h = window.visualViewport.height;
  } else if (window.innerHeight){
    h = window.innerHeight;
  } else if (document.documentElement && document.documentElement.clientHeight){
    h = document.documentElement.clientHeight;
  }
  if (h && h > 0){
    try { document.documentElement.style.setProperty('--app-h', h + 'px'); } catch(e){}
  }
}

/* ---------- 统一触控绑定（避免 300ms 延迟 / 重复触发） ---------- */
function bindTap(el, fn){
  if (!el) return;
  let lastTap = 0;
  function handler(e){
    const now = Date.now();
    if (now - lastTap < 320) return;
    lastTap = now;
    fn.call(el, e);
  }
  el.addEventListener('click', handler, false);
}

/* =========================================================
   常量数据
   ========================================================= */
const DAY_LEN   = 240;  // 白天 4 分钟
const NIGHT_LEN = 180;  // 夜晚 3 分钟
const SAVE_KEY  = 'my_orange_cat_save_v1';

/* ---------------------------------------------------------
   白天：橘猫的随机闯祸事件（40 条）
   --------------------------------------------------------- */
const CAT_EVENTS = [
  '张昊嵩从餐桌上纵身一跃，落地姿势很帅，但摔了个趔趄。',
  '张昊嵩一头撞在了阳台的玻璃门上。',
  '张昊嵩打翻了茶几上的花瓶，水洒了一地。',
  '张昊嵩在客厅里跑酷，从沙发背上直直摔了下来。',
  '张昊嵩想跳到冰箱上，半路掉了下去。',
  '张昊嵩追着自己的尾巴转圈，转晕了撞在墙角。',
  '张昊嵩踩空了沙发扶手，四脚朝天。',
  '张昊嵩从床头柜上滑了下来，爪子刮花了柜面。',
  '张昊嵩被阳台的窗帘裹住，挣扎了半天。',
  '张昊嵩想钻进纸箱，结果纸箱塌了。',
  '张昊嵩从椅子跳上餐桌，把盘子带了下去。',
  '张昊嵩扒拉窗帘杆，被掉下来的杆子砸了脑袋。',
  '张昊嵩在阳台上扑蝴蝶，一头栽进了花盆里。',

function drawCat(x, groundY, t){
  const bob = Math.sin(t*9)*1.2;
  x = Math.round(x);
  const y = Math.round(groundY + bob);

  const C  = '#f2a03c';
  const CD = '#d97d1e';
  const CW = '#fff2dd';

  px(x+1, groundY+1, 13, 2, 'rgba(60,40,20,.25)');

  const tw = Math.sin(t*6)*2;
  px(x-4, y-7+tw, 4, 2, CD);
  px(x-6, y-9+tw, 3, 2, CD);

  px(x, y-7, 11, 7, C);
  px(x+1, y-6, 3, 1, CD);
  px(x+6, y-5, 3, 1, CD);

  px(x+1, y-2, 3, 2, C);
  px(x+7, y-2, 3, 2, C);

  px(x+8, y-11, 8, 8, C);
  px(x+8,  y-13, 3, 3, C);
  px(x+13, y-13, 3, 3, C);
  px(x+9,  y-12, 1, 1, CD);
  px(x+14, y-12, 1, 1, CD);

  px(x+9,  y-9, 2, 2, '#3a2410');
  px(x+13, y-9, 2, 2, '#3a2410');
  px(x+11, y-6, 2, 1, '#e08080');
  px(x+12, y-3, 3, 2, CW);
}

function updateHUD(){
  $('dayNum').textContent = G.day;
  $('phaseEl').textContent = G.phase === 'day' ? '白天 ☀️' : '夜晚 🌙';
  const total = G.phase === 'day' ? DAY_LEN : NIGHT_LEN;
  $('clockEl').textContent = fmt(G.t) + ' / ' + fmt(total);

  if(G.phase === 'day'){
    $('dayStats').classList.remove('hidden');
    $('nightStats').classList.add('hidden');

    setBar('fPoop','nPoop', G.poop, 10);
    setBar('fMood','nMood', G.mood, 10);
  } else {
    $('dayStats').classList.add('hidden');
    $('nightStats').classList.remove('hidden');
    setBar('fAlert','nAlert', G.alert, 10);
  }

  const day = G.phase === 'day';

function showModal(title, desc, options, onChoose){
  paused = true;
  modalTitle.textContent = title;
  modalDesc.textContent = desc;
  modalOpts.innerHTML = '';
  options.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'modalOpt';
    b.type = 'button';
    b.textContent = opt;
    bindTap(b, () => {
      modalEl.classList.add('hidden');
      paused = false;
      onChoose(i);
    });
    modalOpts.appendChild(b);
  });
  modalEl.classList.remove('hidden');
}

/* =========================================================
   存档 / 读档
   ========================================================= */
function saveGame(){
  if(G.phase !== 'day' && G.phase !== 'night') return false;
  const data = {
    day: G.day,
    phase: G.phase,
    t: G.t,
    hp: G.hp, hunger: G.hunger, poop: G.poop, mood: G.mood,
    healUsed: G.healUsed, feedUsed: G.feedUsed, toiletUsed: G.toiletUsed,
    bites: G.bites, moodTimer: G.moodTimer,
    hungerMark: G.hungerMark, poopMark: G.poopMark,
    eventTimes: G.eventTimes.slice(),
    alert: G.alert,
    nightQueue: G.nightQueue.slice(),
    nightEventTimes: G.nightEventTimes.slice(),
    savedAt: Date.now()
  };
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    return true;
  }catch(e){
    return false;
  }
}

function readSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || typeof d !== 'object') return null;
    return d;
  }catch(e){ return null; }
}

function clearSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

function continueGame(){
  const d = readSave();
  if(!d) return;

  savePanel.classList.add('hidden');

  G.phase = (d.phase === 'night') ? 'night' : 'day';
  G.day   = d.day || 1;
  G.t     = typeof d.t === 'number' ? d.t : 0;
  G.hp    = typeof d.hp === 'number' ? d.hp : 10;
  G.hunger= typeof d.hunger === 'number' ? d.hunger : 10;
  G.poop  = typeof d.poop === 'number' ? d.poop : 0;
  G.mood  = typeof d.mood === 'number' ? d.mood : 5;
  G.healUsed   = !!d.healUsed;
  G.feedUsed   = d.feedUsed || 0;
  G.toiletUsed = !!d.toiletUsed;
  G.bites      = d.bites || 0;
  G.moodTimer  = d.moodTimer || 12;
  G.alert      = d.alert || 0;

  G.eventTimes     = Array.isArray(d.eventTimes) ? d.eventTimes.slice() : [];
  G.nightQueue     = Array.isArray(d.nightQueue) ? d.nightQueue.slice() : [];
  G.nightEventTimes= Array.isArray(d.nightEventTimes) ? d.nightEventTimes.slice() : [];

  G.hungerMark = (typeof d.hungerMark === 'number') ? d.hungerMark : Math.floor(G.hunger + 1e-9);
  G.poopMark   = (typeof d.poopMark === 'number') ? d.poopMark : Math.floor(G.poop + 1e-9);

  G.cat = {x:160, tx:200, idle:0, dir:1, anim:0};
  G.speed = 1;
  $('speedBtn').textContent = '⏩ 1x';

  paused = false;
  modalEl.classList.add('hidden');
  endingEl.classList.add('hidden');
  menuEl.classList.add('hidden');
  gameEl.classList.add('active');
  logBox.innerHTML = '';
  lastTs = 0;

  log('━━━━━━━━━━━━━━━━━━━━', 'sys');
  log('📁 读取存档成功。', 'sys');

  if(G.phase === 'day'){
    log('☀️ 第 ' + G.day + ' 天 · 白天继续。', 'sys');
    if(G.eventTimes.length === 0 && G.t < DAY_LEN - 20){
      const remain = DAY_LEN - G.t;
      const n = randInt(1, 3);
      const times = [];
      for(let i=0;i<n;i++) times.push(G.t + remain*(i+1)/(n+1));
      G.eventTimes = times;
    }
  } else {
    log('🌙 夜晚继续。', 'sys');
    if(G.nightEventTimes.length === 0 && G.nightQueue.length > 0){
      const remain = Math.max(20, NIGHT_LEN - G.t);
      const n = G.nightQueue.length;
      G.nightEventTimes = [];
      for(let i=0;i<n;i++) G.nightEventTimes.push(G.t + remain*(i+1)/(n+1));
    }
  }

  updateActions();
  updateHUD();
}

/* ---------------- 主菜单上的存档面板 ---------------- */
function openSavePanel(){
  const d = readSave();
  const info = $('saveInfo');
  const btns = $('saveBtns');
  info.innerHTML = '';
  btns.innerHTML = '';

  function addBtn(label, fn){
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    bindTap(b, fn);
    btns.appendChild(b);
  }

  if(!d){
    info.innerHTML = '<p class="saveEmpty">暂 无 存 档</p>';
  } else {
    const phaseTxt = d.phase === 'night' ? '夜晚 🌙' : '白天 ☀️';
    info.innerHTML =
      '<p>第 ' + (d.day||1) + ' 天 · ' + phaseTxt + '</p>' +
      '<p>生命 ' + r1(d.hp||0) + ' · 饥饿 ' + r1(d.hunger||0) +
        ' · 便意 ' + r1(d.poop||0) + ' · 心情 ' + r1(d.mood||0) + '</p>' +
      '<p>警惕值 ' + (d.alert||0) + ' / 10</p>' +
      '<p class="saveTime">保存于 ' + new Date(d.savedAt || Date.now()).toLocaleString() + '</p>';

    addBtn('读取存档', continueGame);
    addBtn('删除存档', () => { clearSave(); openSavePanel(); });
  }

  addBtn('关闭', () => { savePanel.classList.add('hidden'); });
  savePanel.classList.remove('hidden');
}

/* =========================================================
   白天逻辑
   ========================================================= */
function startDay(){
  G.phase = 'day';
  G.t = 0;
  G.healUsed = false;
  G.feedUsed = 0;
  G.toiletUsed = false;
  G.moodTimer = 12;
  G.cat.x = 160;
  G.cat.tx = rand(20, 300);
  G.cat.idle = 0;

  G.hungerMark = Math.floor(G.hunger + 1e-9);
  G.poopMark   = Math.floor(G.poop + 1e-9);

  const moodFactor = (10 - G.mood) / 10 * 4;
  let count = Math.round(1 + moodFactor + rand(-0.6, 0.6));
  count = clamp(count, 1, 5);

  const seg = DAY_LEN / (count + 1);
  const times = [];
  for(let i=0;i<count;i++){
    times.push(clamp(seg*(i+1) + rand(-seg*0.28, seg*0.28), 6, DAY_LEN-6));
  }
  times.sort((a,b)=>a-b);
  G.eventTimes = times;

  log('━━━━━━━━━━━━━━━━━━━━', 'sys');
  log('☀️ 第 ' + G.day + ' 天 · 白天开始了。', 'sys');
  log('张昊嵩在屋里溜达，心情：' + G.mood + '/10。它今天大概会闯 ' + count + ' 次祸。');

  updateActions();
  updateHUD();
}

function updateDay(dt){
  if(paused) return;

  G.t += dt;
  G.cat.anim += dt;

  G.hunger = Math.max(0, G.hunger - (2/60)*dt);
  G.poop = Math.min(10, G.poop + (1/60)*dt);

  const hInt = Math.floor(G.hunger + 1e-9);
  if(hInt !== G.hungerMark){
    const delta = hInt - G.hungerMark;
    if(delta < 0){
      log('🍽️ 张昊嵩饿了，饥饿值 ' + delta + '（' + r1(G.hunger) + '/10）');
    }else{
      log('🍽️ 张昊嵩的饥饿值 +' + delta + '（' + r1(G.hunger) + '/10）','good');
    }
    G.hungerMark = hInt;
  }

  const pInt = Math.floor(G.poop + 1e-9);
  if(pInt !== G.poopMark){
    const delta = pInt - G.poopMark;
    if(delta > 0){
      log('💩 张昊嵩想上厕所了，便意值 +' + delta + '（' + r1(G.poop) + '/10）');
    }else{
      log('💩 张昊嵩的便意值 ' + delta + '（' + r1(G.poop) + '/10）','good');
    }
    G.poopMark = pInt;
  }

  G.moodTimer -= dt;
  if(G.moodTimer <= 0){
    G.moodTimer = rand(12, 26);
    const up = Math.random() < 0.5;
    if(up && G.mood < 10){
      G.mood = clamp(G.mood + 1, 0, 10);
      log('😺 ' + pick(MOOD_UP) + '  心情值 +1（' + G.mood + '/10）','good');
    } else if(!up && G.mood > 0){
      G.mood = clamp(G.mood - 1, 0, 10);
      log('😾 ' + pick(MOOD_DOWN) + '  心情值 -1（' + G.mood + '/10）','warn');
    }
  }

  updateCatMove(dt);

  while(G.eventTimes.length && G.t >= G.eventTimes[0]){
    G.eventTimes.shift();
    triggerCatEvent();
    if(paused || G.phase !== 'day') return;
  }

  if(G.hp <= 0){ endGame('dead'); return; }
  if(G.hunger <= 0){ endGame('starve'); return; }
  if(G.poop >= 10){ endGame('poop'); return; }

  if(G.t >= DAY_LEN){ startNight(); }
}

function updateCatMove(dt){
  const c = G.cat;
  const dx = c.tx - c.x;
  if(Math.abs(dx) < 1.5){
    c.idle -= dt;
    if(c.idle <= 0){
      c.tx = rand(12, 300);
      c.idle = rand(0.8, 2.6);
    }
  } else {
    const speed = 26;
    c.x += Math.sign(dx) * speed * dt;
    c.dir = Math.sign(dx);
  }
}

function triggerCatEvent(){
  const txt = pick(CAT_EVENTS);
  G.hp = Math.max(0, G.hp - 1);
  log('⚠️ ' + txt, 'warn');
  log('   张昊嵩受了点伤，生命值 -1（' + G.hp + '/10）','warn');
  updateHUD();
  if(G.hp <= 0){ endGame('dead'); }
}

/* =========================================================
   玩家操作
   ========================================================= */
function doHeal(){
  if(G.phase !== 'day' || G.healUsed) return;
  G.healUsed = true;
  const before = G.hp;
  G.hp = Math.min(10, G.hp + 3);
  log('🩹 你给张昊嵩包扎了伤口，生命值 +' + r1(G.hp - before) + '（' + r1(G.hp) + '/10）。','good');
  updateActions(); updateHUD();
}

function doFeed(){
  if(G.phase !== 'day' || G.feedUsed >= 2) return;
  G.feedUsed++;
  const before = G.hunger;
  G.hunger = Math.min(10, G.hunger + 3);
  G.hungerMark = Math.floor(G.hunger + 1e-9);
  log('🍚 你倒了一碗猫粮，张昊嵩埋头猛吃，饥饿值 +' + r1(G.hunger - before) + '（' + r1(G.hunger) + '/10）。','good');
  updateActions(); updateHUD();
}

function doToilet(){
  if(G.phase !== 'day' || G.toiletUsed) return;
  G.toiletUsed = true;
  const before = G.poop;
  G.poop = Math.max(0, G.poop - 3);
  G.poopMark = Math.floor(G.poop + 1e-9);
  log('🚽 你清理了猫砂盆，张昊嵩舒服地解决了，便意值 ' + r1(G.poop - before) + '（' + r1(G.poop) + '/10）。','good');
  updateActions(); updateHUD();
}

function doPet(){
  if(G.phase !== 'day') return;
  const biteChance = G.mood >= 6 ? 0 : (6 - G.mood) * 0.08;

  if(Math.random() < biteChance){
    G.bites++;
    log('🩸 张昊嵩心情不好，回头就咬了你一口！（被咬 ' + G.bites + '/5）','warn');
    if(G.bites >= 5){
      G.bites = 0;
      setTimeout(askAboutBite, 260);
    }
  } else {
    log('🐱 张昊嵩发出咕噜咕噜的声音，脑袋往你手心里蹭了蹭。','good');
  }
}

function askAboutBite(){
  showModal(
    '【忍无可忍】',
    '张昊嵩已经咬了你五口了。\n手背上的牙印火辣辣地疼，它却舔着爪子，一脸无辜。\n你要怎么做？',
    ['训斥它', '抛弃它'],
    idx => {
      if(idx === 0){
        log('🗣️ 你板起脸训斥了张昊嵩。');
        const s = pick(TALK_BACK);
        log('🐱 张昊嵩回嘴了：' + s, 'warn');
        log('   你盯着它看了三秒，最后没忍住笑了出来。');
      } else {
        log('🚪 你打开门，把张昊嵩抱了出去。');
        log('   它在门口愣了很久，尾巴慢慢垂了下去。','warn');
        endGame('stray');
      }
    }
  );
}

/* =========================================================
   夜晚逻辑
   ========================================================= */
function startNight(){
  G.phase = 'night';
  G.t = 0;
  G.alert = 0;

  const basics = shuffle(BASIC.map((_,i)=>i)).slice(0,4);
  const advIdx = randInt(0, ADV.length-1);
  let list = basics.map(i=>({type:'basic', i}));
  list.push({type:'adv', i:advIdx});
  if(Math.random() < 0.25){
    const k = randInt(0,3);
    list[k] = {type:'danger', i: randInt(0, DANGER.length-1)};
  }
  G.nightQueue = shuffle(list);

  G.nightEventTimes = [];
  for(let i=0;i<5;i++){
    G.nightEventTimes.push(22 + i*34 + rand(-6,6));
  }
  G.nightEventTimes.sort((a,b)=>a-b);

  updateActions();
  updateHUD();

  log('━━━━━━━━━━━━━━━━━━━━', 'sys');
  log('🌙 夜深了，王慕婷洗漱完，钻进被窝睡着了。', 'night');
  log('   客厅里，橘猫的身影慢慢拉长……', 'night');
  log('   张昊嵩变成了人形，轻手轻脚地走进了卧室。', 'night');
  log('   ——今晚，你操控的是张昊嵩。', 'night');
}

function updateNight(dt){
  if(paused) return;
  G.t += dt;

  while(G.nightEventTimes.length && G.t >= G.nightEventTimes[0]){
    G.nightEventTimes.shift();
    showNightEvent();
    return;
  }

  if(G.t >= NIGHT_LEN && G.nightQueue.length === 0 && G.nightEventTimes.length === 0){
    G.phase = 'day';
    G.day++;
    log('🌅 天亮了。张昊嵩伸了个懒腰，又变回了那只圆滚滚的橘猫。', 'sys');
    setTimeout(startDay, 300);
  }
}

function showNightEvent(){
  const ev = G.nightQueue.shift();
  if(!ev) return;
  const data = ev.type === 'basic' ? BASIC[ev.i]
             : ev.type === 'adv'   ? ADV[ev.i]
             :                       DANGER[ev.i];

  const pool = [1,1,1,2,2,3];
  const incs = [pick(pool), pick(pool), pick(pool)];
  const opts = [data[1], data[2], data[3]];
  const order = shuffle([0,1,2]);

  const titleMap = { basic:'【夜色 · 静谧】', adv:'【夜色 · 心跳】', danger:'【夜色 · 危险】' };

  paused = true;
  modalTitle.textContent = titleMap[ev.type];
  modalDesc.textContent = data[0];
  modalOpts.innerHTML = '';

  order.forEach(i => {
    const b = document.createElement('button');
    b.className = 'modalOpt';
    b.type = 'button';
    b.textContent = opts[i];
    bindTap(b, () => {
      modalEl.classList.add('hidden');
      paused = false;

      const inc = incs[i];
      G.alert = Math.min(10, G.alert + inc);
      log('· ' + data[0], 'night');
      log('  → 你选择了「' + opts[i] + '」，警惕值 +' + inc + '（' + G.alert + '/10）');
      updateHUD();

      if(G.alert >= 10){
        endGame('alert');
      }
    });
    modalOpts.appendChild(b);
  });
  modalEl.classList.remove('hidden');
}

/* =========================================================
   结局
   ========================================================= */
function endGame(key){
  G.phase = 'end';
  paused = true;
  clearSave();
  const e = ENDINGS[key];
  endingEl.querySelector('#endTitle').textContent = e.title;
  endingEl.querySelector('#endText').textContent = e.text;
  endingEl.classList.remove('hidden');
  log('💀 游戏结束 —— ' + e.title.replace(/ /g,''), 'warn');
}

/* =========================================================
   界面切换
   ========================================================= */
function exitToMenu(){
  G.phase = 'menu';
  paused = false;
  modalEl.classList.add('hidden');
  endingEl.classList.add('hidden');
  savePanel.classList.add('hidden');
  gameEl.classList.remove('active');
  menuEl.classList.remove('hidden');
}

/* =========================================================
   渲染主循环
   ========================================================= */
let lastTs = 0;
let hudTick = 0;

function loop(ts){
  requestAnimationFrame(loop);
  const dtRaw = lastTs ? Math.min(0.06, (ts - lastTs)/1000) : 0;
  lastTs = ts;
  const dt = dtRaw * G.speed;

  if(G.phase === 'day') updateDay(dt);
  else if(G.phase === 'night') updateNight(dt);

  if(G.phase === 'day' || G.phase === 'night'){
    ctx.clearRect(0,0,320,100);
    if(G.phase === 'day') drawDayScene();
    else drawNightScene();

    hudTick += dtRaw;
    if(hudTick > 0.08){
      hudTick = 0;
      updateHUD();
    }
  }
}

/* =========================================================
   启动 / 重开
   ========================================================= */
function startGame(){
  G.phase = 'day';
  G.day = 1;
  G.t = 0;
  G.speed = 1;
  $('speedBtn').textContent = '⏩ 1x';
  G.hp = 10;
  G.hunger = 10;
  G.poop = 0;
  G.mood = 5;
  G.healUsed = false;
  G.feedUsed = 0;
  G.toiletUsed = false;
  G.bites = 0;
  G.alert = 0;
  G.hungerMark = 10;
  G.poopMark = 0;
  G.moodTimer = 12;
  G.eventTimes = [];
  G.nightQueue = [];
  G.nightEventTimes = [];
  G.cat = {x:160, tx:200, idle:0, dir:1, anim:0};
  paused = false;

  logBox.innerHTML = '';
  modalEl.classList.add('hidden');
  endingEl.classList.add('hidden');
  savePanel.classList.add('hidden');
  menuEl.classList.add('hidden');
  gameEl.classList.add('active');

  lastTs = 0;
  startDay();
}

/* =========================================================
   初始化
   ========================================================= */
function init(){
  /* 视口高度同步 */
  syncAppHeight();
  let rafPending = false;
  function scheduleSync(){
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function(){
      rafPending = false;
      syncAppHeight();
    });
  }
  window.addEventListener('resize', scheduleSync, { passive:true });
  window.addEventListener('orientationchange', function(){
    setTimeout(syncAppHeight, 100);
    setTimeout(syncAppHeight, 350);
  });
  if (window.visualViewport){
    try{
      window.visualViewport.addEventListener('resize', scheduleSync, { passive:true });
      window.visualViewport.addEventListener('scroll', scheduleSync, { passive:true });
    }catch(e){}
  }

  /* 按钮绑定（统一使用 bindTap） */
  bindTap($('startBtn'), startGame);
  bindTap($('saveBtn'), openSavePanel);

  bindTap($('restartBtn'), () => {
    endingEl.classList.add('hidden');
    exitToMenu();
  });

  bindTap($('btnHeal'), doHeal);
  bindTap($('btnFeed'), doFeed);
  bindTap($('btnToilet'), doToilet);
  bindTap($('btnPet'), doPet);

  bindTap($('speedBtn'), () => {
    G.speed = G.speed === 1 ? 2 : (G.speed === 2 ? 4 : 1);
    $('speedBtn').textContent = '⏩ ' + G.speed + 'x';
  });

  bindTap($('settingsBtn'), () => {
    if(G.phase !== 'day' && G.phase !== 'night') return;
    showModal(
      '【设置】',
      '游戏已暂停。\n你可以继续游戏，或保存进度并返回主菜单。',
      ['继续游戏', '存档并退出'],
      idx => {
        if(idx === 0) return;
        const ok = saveGame();
        if(ok) log('💾 进度已保存。','sys');
        else   log('⚠️ 存档失败（浏览器存储不可用）。','warn');
        setTimeout(exitToMenu, ok ? 180 : 420);
      }
    );
  });

  /* 防止在日志/弹窗区域误触双击缩放 */
  document.addEventListener('dblclick', function(e){
    e.preventDefault();
  }, { passive: false });

  requestAnimationFrame(loop);
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
